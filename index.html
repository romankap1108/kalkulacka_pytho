<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Kalkulačka</title>
<style>
    body {
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #111;
        color: white;
    }

    .box {
        background: #1c1c1c;
        padding: 20px;
        border-radius: 10px;
        width: 260px;
        text-align: center;
    }

    input, select, button {
        width: 100%;
        margin: 5px 0;
        padding: 8px;
        border: none;
        border-radius: 5px;
    }

    button {
        background: #4caf50;
        color: white;
        cursor: pointer;
    }

    #result {
        margin-top: 10px;
        font-size: 18px;
    }
</style>
</head>
<body>

<div class="box">
    <input id="num1" type="number" placeholder="První číslo">
    <input id="num2" type="number" placeholder="Druhé číslo">

    <select id="op">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <button onclick="calc()">Spočítat</button>
    <button onclick="resetCalc()">Další výpočet</button>

    <div id="result"></div>
</div>

<script>
function calc() {
    let f_num = parseFloat(document.getElementById("num1").value);
    let s_num = parseFloat(document.getElementById("num2").value);
    let oper = document.getElementById("op").value;

    let res;

    if (oper === "+") {
        res = f_num + s_num;
    } else if (oper === "-") {
        res = f_num - s_num;
    } else if (oper === "*") {
        res = f_num * s_num;
    } else if (oper === "/") {
        res = f_num / s_num;
    } else {
        res = "Error";
    }

    document.getElementById("result").innerText = res;
}

function resetCalc() {
    document.getElementById("num1").value = "";
    document.getElementById("num2").value = "";
    document.getElementById("result").innerText = "";
}
</script>

</body>
</html>
