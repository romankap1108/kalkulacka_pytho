<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
</head>
<body>

<h2>Kalkulačka</h2>

<div id="app">
  <input id="fnum" placeholder="Napište první číslo">
  <input id="oper" placeholder="Napište operace">
  <input id="snum" placeholder="Napište druhe číslo">

  <button onclick="runCalc()">OK</button>

  <p id="out"></p>

  <input id="cont" placeholder="Stisknite na 'y', abych pokračovat...">
  <button onclick="next()">Pokračovat</button>
</div>

<script>
let running = true;

function runCalc() {
  let f_num = parseFloat(document.getElementById("fnum").value);
  let oper = document.getElementById("oper").value;
  let s_num = parseFloat(document.getElementById("snum").value);

  let result;

  if (oper == '+') {
    result = f_num + s_num;
  } else if (oper == '-') {
    result = f_num - s_num;
  } else if (oper == '*') {
    result = f_num * s_num;
  } else if (oper == '/') {
    result = f_num / s_num;
  } else {
    result = "Error";
  }

  document.getElementById("out").innerText = result;
}

function next() {
  let prodlouzit = document.getElementById("cont").value;

  if (prodlouzit == 'y') {
    document.getElementById("fnum").value = "";
    document.getElementById("oper").value = "";
    document.getElementById("snum").value = "";
    document.getElementById("out").innerText = "";
    document.getElementById("cont").value = "";
  } else {
    document.getElementById("app").innerHTML = "<h3>Konec programu</h3>";
  }
}
</script>

</body>
</html>
