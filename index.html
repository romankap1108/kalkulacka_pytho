<!DOCTYPE html>
<html>
<body>

<script>
let prodlouzit = 'y';

while (prodlouzit == 'y') {

    let f_num = parseFloat(prompt("Napište první číslo>>"));
    let oper = prompt("Napište operace>>");
    let s_num = parseFloat(prompt("Napište druhe číslo>>"));

    if (oper == '+') {
        alert(f_num + s_num);
    } else if (oper == '-') {
        alert(f_num - s_num);
    } else if (oper == '*') {
        alert(f_num * s_num);
    } else if (oper == '/') {
        alert(f_num / s_num);
    } else {
        alert("Error");
    }

    prodlouzit = prompt("Stisknite na 'y', abych pokračovat, nebo jine tlačítko, abych ukončit>>");
}

</script>

</body>
</html>
