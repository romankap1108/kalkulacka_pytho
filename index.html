<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Kalkulačka</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1e1e1e;
            color: white;
        }

        .calc {
            background: #2c2c2c;
            padding: 20px;
            border-radius: 15px;
            width: 250px;
            text-align: center;
        }

        input, select, button {
            width: 100%;
            margin: 5px 0;
            padding: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #4caf50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .result {
            margin-top: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="calc">
    <h2>Kalkulačka</h2>

    <input type="number" id="num1" placeholder="První číslo">
    
    <select id="oper">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input type="number" id="num2" placeholder="Druhé číslo">

    <button onclick="calculate()">Spočítat</button>

    <div class="result" id="result"></div>
</div>

<script>
function calculate() {
    let f = parseFloat(document.getElementById("num1").value);
    let s = parseFloat(document.getElementById("num2").value);
    let op = document.getElementById("oper").value;

    let result;

    if (op === "+") result = f + s;
    else if (op === "-") result = f - s;
    else if (op === "*") result = f * s;
    else if (op === "/") result = f / s;
    else result = "Error";

    document.getElementById("result").innerText = "Výsledek: " + result;
}
</script>

</body>
</html>
